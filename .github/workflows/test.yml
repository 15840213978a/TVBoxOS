name: Test

on:
  schedule:
    - cron: '0 13 1 * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: q215613905
            repoName: TVBoxOS
            branchName: main
            java_ver: 17

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check New Commit
        shell: bash
        run: |
          set -euo pipefail

          upStream="https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}"
          echo "upStream=$upStream" >> "$GITHUB_ENV"

          commit="$(git ls-remote "${upStream}.git" "refs/heads/${{ matrix.branchName }}" | awk 'NR==1 {print $1}')"

          if ! [[ "$commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            commit="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}" \
              | jq -r '.sha // empty' || true)"
          fi

          if ! [[ "$commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::无法取得上游合法 commit SHA"
            exit 1
          fi

          echo "Resolved commit=$commit"

          if ! grep -q "$commit" README.md || [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "commit=$commit" >> "$GITHUB_ENV"
            echo "commitS=${commit:0:7}" >> "$GITHUB_ENV"
          else
            echo "没有新提交，本次跳过构建"
          fi

      - name: Checkout Source Code
        if: ${{ env.commit != '' && env.commit != 'null' }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "${{ matrix.branchName }}" --single-branch "${{ env.upStream }}.git" TVBoxOSC
          cd TVBoxOSC
          git checkout --detach "${{ env.commit }}"
          echo "tag=$(git log -1 --date=format:'%Y%m%d-%H%M' --pretty=format:%cd "${{ env.commit }}")" >> "$GITHUB_ENV"

      - name: Setup Java
        if: ${{ env.commit != '' && env.commit != 'null' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_ver }}

      - name: Setup Android SDK
        if: ${{ env.commit != '' && env.commit != 'null' }}
        uses: android-actions/setup-android@v3

      - name: Setup Python for Chaquopy
        if: ${{ env.commit != '' && env.commit != 'null' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ensure local.properties
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found: $SDK_DIR"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$SDK_DIR" > local.properties
          echo "Created $(pwd)/local.properties"
          cat local.properties

      - name: Extra Modify
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          set -euo pipefail

          echo '修改VersionName'
          sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${{ env.tag }}\'#" app/build.gradle || true

          if [ -f app/src/main/res/layout/dialog_about.xml ]; then
            sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml || true
          fi

          echo 'crosswalk源，防挂'
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          elif grep -q 'jitpack.io' build.gradle; then
            sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi

      - name: Release Apk Sign
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          set -euo pipefail

          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'

          signingConfigs="$(echo "$signingConfigs" | base64 -d)"
          signingConfig="$(echo "$signingConfig" | base64 -d)"

          sed -i \
            -e "/defaultConfig {/i\\$signingConfigs " \
            -e "/debug {/a\\$signingConfig " \
            -e "/release {/a\\$signingConfig " \
            app/build.gradle

          test -f "${{ github.workspace }}/.github/workflows/TVBoxOSC.jks"
          cp -f "${{ github.workspace }}/.github/workflows/TVBoxOSC.jks" app/TVBoxOSC.jks

          {
            echo 'RELEASE_STORE_FILE=./TVBoxOSC.jks'
            echo 'RELEASE_KEY_ALIAS=TVBoxOSC'
            echo 'RELEASE_STORE_PASSWORD=TVBoxOSC'
            echo 'RELEASE_KEY_PASSWORD=TVBoxOSC'
          } >> gradle.properties

          sed -i 's/^#\(org.gradle.jvmargs=.*\)/\1/' gradle.properties || true

      - name: Setup Gradle
        if: ${{ env.commit != '' && env.commit != 'null' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Verify local.properties before build
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          set -euo pipefail
          test -f local.properties
          test -s local.properties
          grep -q '^sdk.dir=' local.properties
          cat local.properties

      - name: Force Create local.properties Before Gradle
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "===== check local.properties ====="
          pwd
          ls -la
          cat local.properties

      - name: Fix Chaquopy buildPython path
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          set -e
          if [ -f pyramid/build.gradle ]; then
            sed -i 's#D:/Programs/Python/Python38/python.exe#python3#g' pyramid/build.gradle || true
          fi
          grep -R "buildPython" -n pyramid || true

      - name: Build With Gradle
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assemblerelease --build-cache --parallel --no-daemon --warning-mode all

      - name: Prepare App
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apk/
          mkdir -p apk/

          while IFS= read -r file; do
            base="$(basename "$file")"
            if [[ "$base" == TVBox_* ]]; then
              new_base="$(echo "$base" | sed "s/release/${{ matrix.userName }}_${{ env.tag }}/")"
            else
              new_base="TVBox_${{ matrix.userName }}_${{ env.tag }}.apk"
            fi
            cp -f "$file" "apk/$new_base"
          done < <(find . -type f -name "*release*.apk" -print)

          ls -lh apk/

      - name: Release Note
        if: ${{ env.commit != '' && env.commit != 'null' }}
        working-directory: TVBoxOSC
        shell: bash
        run: |
          lastCommit="$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" "${{ github.workspace }}/README.md" | grep -o '[a-z0-9]\{40\}' | head -1 || true)"
          export LESSCHARSET=utf-8

          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log

          if [ -z "$lastCommit" ] || [ "${{ env.commit }}" = "$lastCommit" ]; then
            git log --pretty=format:%B "${{ env.commitS }}" -1 \
              | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' \
              | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- \
              >> apk/${{ matrix.userName }}-Release.log
          else
            git log --pretty=format:%B "${{ env.commitS }}...${lastCommit:0:7}" \
              | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' \
              | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- \
              >> apk/${{ matrix.userName }}-Release.log || true
          fi

          echo -e '\n```' >> apk/${{ matrix.userName }}-Release.log

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit != '' && env.commit != 'null' }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}
          path: |
            TVBoxOSC/apk/*

      - name: Publish GitHub Release
        if: ${{ env.commit != '' && env.commit != 'null' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: TVBoxOS ${{ env.tag }}
          body: |
            TVBoxOS 自动构建版本

            Commit:
            ${{ env.commit }}
          files: |
            TVBoxOSC/apk/*.apk

      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commit != '' && env.commit != 'null' }}
        run: |
          echo "commit=" >> "$GITHUB_ENV"

  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
